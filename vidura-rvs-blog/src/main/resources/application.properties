# ===================================================================
# ViduraRvs blog configuration
# Copy this file, or edit it directly, to match your local MySQL setup.
# ===================================================================

spring.application.name=ViduraRvs

# ---- Server ----
server.port=${PORT:8080}

# ---- MySQL datasource ----
# 1. Create the database first:  CREATE DATABASE vidurarvs_blog;
# 2. Fill in your own MySQL username/password below.
spring.datasource.url=jdbc:mysql://localhost:3306/vidurarvs_blog?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ithelp@#2026A
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" auto-creates/updates tables from the entities below - convenient
# while you are learning and iterating. Switch to a real migration tool
# (Flyway/Liquibase) before this ever runs in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
# Turn caching off while developing so template edits show up without a restart.
spring.thymeleaf.cache=false

# ---- File uploads (cover images) ----
# Uploaded images are written to this folder on disk and served back at
# /uploads/**. Change this to an absolute path outside the project if you
# prefer (e.g. C:/vidurarvs-uploads or /var/vidurarvs/uploads).
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Initial super-admin account ----
# Created automatically the first time the app starts, only if no users
# exist yet in the database. Change these before your first run, and
# change the password from the admin panel afterwards.
app.bootstrap.super-admin.full-name=Vidura Rammandalagedara
app.bootstrap.super-admin.username=vidura
app.bootstrap.super-admin.email=vidurarvs@gmail.com
app.bootstrap.super-admin.password=ViduraRvs@2005

# ---- Pagination ----
app.pagination.page-size=8
