# ===================================================================
# ViduraRvs blog configuration — tuned for Oracle Free Tier (Arm A1)
# ===================================================================

spring.application.name=ViduraRvs

# ---- Server ----
server.port=${PORT:8080}

# HTTP response compression — saves bandwidth on Oracle Free Tier
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# Tomcat thread tuning for low-memory VM (Arm A1: 6 GB RAM, 4 cores)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=50

# ---- MySQL datasource ----
# Database created with: CREATE DATABASE vidurarvs_blog CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# Dedicated DB user (NOT root — already created in MySQL):
#   CREATE USER 'vidura_blog'@'localhost' IDENTIFIED BY 'Ithelp@#2026A';
#   GRANT ALL PRIVILEGES ON vidurarvs_blog.* TO 'vidura_blog'@'localhost';
spring.datasource.url=jdbc:mysql://localhost:3306/vidurarvs_blog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=vidurarvs_blog
spring.datasource.password=ViduraRvs@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — keep pool small on free-tier VM to avoid OOM
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ---- JPA / Hibernate ----
# "update" auto-creates/updates tables from entities. Run db-migration.sql first
# for new columns (ALTER TABLE statements), then restart the app.
# Switch to Flyway before production goes live.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
# Set to false during development so template edits show without a restart.
# Change to true in production for significant performance gain.
spring.thymeleaf.cache=false

# ---- Static resource caching ----
spring.web.resources.cache.period=31536000
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# ---- File uploads (images) ----
# Up to 5 images per post; increased limit for multiple uploads.
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ---- Initial super-admin account ----
# Created automatically the first time the app starts, only if no users
# exist yet in the database. Change these before your first run, and
# change the password from the admin panel afterwards.
app.bootstrap.super-admin.full-name=Vidura Rammandalagedara
app.bootstrap.super-admin.username=vidura
app.bootstrap.super-admin.email=vidurarvs@gmail.com
app.bootstrap.super-admin.password=ViduraRvs@2005

# ---- Pagination ----
app.pagination.page-size=8
